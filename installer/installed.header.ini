; installed.ini -- written by the Infovox 230 installer.
;
; The languages and voices you chose when you installed. Only the voices
; listed under [Voices] are published to Windows speech; the rest of the
; built-in table is left alone, and only the languages listed under
; [Languages] have had their rule files installed.
;
; To change what is installed, run the installer again and choose Custom on
; its "Select components" page. Your previous choice is what it starts from.
;
; Deleting this file publishes every built-in voice again -- but a voice
; whose language was never installed has no rule file to speak from, so the
; voice list would then name voices that cannot speak. The installer is the
; better way round.
;
; Voices you have defined yourself live in voices.ini and are not affected
; by anything here.
