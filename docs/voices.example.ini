; voices.ini -- define your own Infovox 230 voices, or change the built-in ones.
;
; You do not have to edit this file by hand. The configuration utility --
;   Start menu -> Infovox 230 -> Infovox 230 Configuration
; writes exactly the same file, will speak a voice to you before you keep it,
; and publishes the result to Windows for you. It keeps whatever you have typed
; here, comments included. This file is the reference for what it is doing, and
; the way to do it by hand if you would rather.
;
; Copy this file to voices.ini, either next to Infovox230SAPI.dll in the install
; folder (for everyone) or in
;   %LOCALAPPDATA%\Infovox230SAPI\voices.ini
; (for just you). The per-user file is read second and wins.
;
; After editing, republish the voice list:
;   Start menu -> Infovox 230 -> Refresh the voice list
; or from a command prompt running as administrator:
;   regsvr32 /s "C:\Program Files\Infovox230\Infovox230SAPI.dll"
;
; Each [section] is one voice, and the section name is what appears in the
; Windows voice list -- call it whatever you like. A section whose name matches a
; built-in voice changes that voice instead of adding a new one.
;
; ---------------------------------------------------------------------------
; The settings. These are the engine's own, spelled the way it spells them.
;
;   BasedOn      Copy every setting from this existing voice first, then apply
;                whatever else this section names. Nearly always what you want:
;                it fixes the language for you. Without it, a new voice starts
;                from the first built-in voice, which is American English.
;
;   LanguageFile Which language the voice speaks. Set this only if you are not
;                using BasedOn. One of:
;                  amrules.ivx  American English    blrules.ivx  British English
;                  darules.ivx  Danish              durules.ivx  Dutch
;                  firules.ivx  Finnish             frrules.ivx  French
;                  gerules.ivx  German              icrules.ivx  Icelandic
;                  itrules.ivx  Italian             norules.ivx  Norwegian
;                  sprules.ivx  Castilian Spanish   swrules.ivx  Swedish
;
;   LanguageID   The language's number, which tells programs and screen readers
;                what language this voice speaks. 1033 American English, 2057
;                British English, 6 Danish, 19 Dutch, 11 Finnish, 12 French,
;                7 German, 15 Icelandic, 16 Italian, 20 Norwegian, 10 Spanish,
;                29 Swedish. BasedOn sets this for you.
;
; --- the four settings that actually shape the sound ---
;
;   Pitch        Base pitch. The engine works out the pitch in hertz as
;                   hertz = 3 x Pitch - 49
;                and will not go below 30 Hz or above 250 Hz, so useful values
;                run from about 27 to 99. Measured, not guessed: Pitch 60 comes
;                out at 131 Hz, Pitch 90 at 220 Hz.
;                For reference, the built-in speakers use
;                  Male 50 (101 Hz)   Female 73 (169 Hz)   Child 90 (220 Hz)
;                The pitch control in your program moves up and down from here,
;                so a voice set near the ends of the range has less room to move.
;
;   Dynamic      Loudness contour, roughly 0 to 100. Higher is more forceful and
;                more strongly stressed; lower is flatter and calmer.
;                Built-ins: Male 32, Female 53, Child 57, Giant 25, Zombie 38.
;
;   Aspiration   Breathiness, roughly 0 to 100. 0 is clean, higher is breathier
;                and more whispery. Built-ins: 0 for most, 15 for Child.
;
;   FormantNo    Which vocal tract shape to use, 0 to 4. This changes the
;                character of a voice more than anything else.
;                Built-ins: Male 0, Female 1, Giant 2, Child 3, Zombie 4.
;
; --- cosmetic ---
;
;   Gender       1 female, 2 male. Only affects what programs report.
;   Age          In years. Programs show 12 or under as a child's voice.
;   LCID         Override the Windows language code, in hex, e.g. 0409.
;
; --- rarely needed, and listed here because the engine reads them ---
;
;   LibraryFile  }  Data files the engine will look for beside its rule files.
;   PhSymFile    }  The Infovox 230 build these voices come from names none of
;   DiphoneFile  }  them, so they are normally left out entirely. Set one only
;   MappingFile  }  if you have a data file the engine is asking for.
;
;   SpeakerStyle An extra descriptive string the engine keeps with the mode.
;                Empty in every built-in voice.
;
; SpeakerName and SpeakerStyle cannot be set for a voice you add. The engine
; checks SpeakerName against the languages it knows and silently drops any voice
; whose name it does not recognise, so it is generated for you from the
; language. Your section name is what you and your programs see.
; ---------------------------------------------------------------------------


; A deep, calm English voice: well below the standard male pitch, with a flatter
; delivery and the "large" vocal tract.
[Infovox English Deep]
BasedOn=Infovox American English Male
Pitch=34
Dynamic=28
Aspiration=0
FormantNo=2
Gender=2
Age=45

; A breathy, quiet Swedish voice.
[Infovox Swedish Whisper]
BasedOn=Infovox Swedish Female
Pitch=70
Dynamic=20
Aspiration=75
FormantNo=1
Gender=1
Age=30

; As low and as large as the engine will go.
[Infovox German Colossus]
BasedOn=Infovox German Giant
Pitch=27
Dynamic=70
Aspiration=0
FormantNo=2
Gender=2
Age=40

; A bright, quick child's voice in French.
[Infovox French Sprite]
BasedOn=Infovox French Child
Pitch=95
Dynamic=65
Aspiration=10
FormantNo=3
Gender=1
Age=8

; Changing a built-in voice rather than adding one: this makes the American
; English Child voice a little lower and less shrill. Remove the semicolons to
; try it.
;[Infovox American English Child]
;Pitch=80
;Dynamic=50


; ---------------------------------------------------------------------------
; [Settings] -- everything that is not a property of one voice.
;
; This section is optional, and any key left out keeps the value shown below.
; The configuration utility writes all of it from its Engine settings page. As
; with the voices, a machine-wide file is read first and a personal one second,
; so a setting here for one user overrides the same setting for everybody.
; ---------------------------------------------------------------------------

;[Settings]

; The engine ends every utterance with about eight tenths of a second of
; inaudible padding. Left in place, that is most of a second of dead air after
; everything a screen reader says, so it is trimmed. Set this to 0 to hear
; exactly what the engine produced.
;TrimTrailingSilence=1

; A sample at or below this level counts as silence, out of a full scale of
; 32767. The padding being trimmed sits at plus or minus one.
;SilenceThreshold=16

; Whether the engine reports where it is in the text as it speaks. Word
; positions are what a program uses to highlight the word being spoken; turn
; them off if a program's highlighting is more trouble than it is worth.
;WordEvents=1
;SentenceEvents=1

; How long an utterance may take before a wedged engine is given up on: this
; many milliseconds, plus this many per character of text.
;TimeoutBaseMs=30000
;TimeoutPerCharMs=200

; How far the rate and pitch controls in a speech program reach. Zero means the
; engine is asked, which is what normally happens: about 15 to 500 words a
; minute, and 30 to 250 hertz. Setting a lower RateMax spreads what is left over
; the same number of steps, which makes the control finer.
;RateMin=0
;RateMax=0
;RateDefault=0
;PitchMin=0
;PitchMax=0
;PitchDefault=0

; What the configuration utility speaks when you preview a voice.
;PreviewText=This is the Infovox 230 speech engine, speaking with the voice you have just made.
